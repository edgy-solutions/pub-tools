[project]
name = "pub_tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster",
    "dagster-cloud",
    "dagster-postgres",
    "dlt[parquet,s3]>=1.22.2",
    "requests>=2.32.5",
    # PUB LOG CSV -> Parquet conversion. DuckDB's httpfs extension reads and
    # writes s3:// directly, so a multi-GiB CSV converts without landing on
    # the pod's disk. NOTE: httpfs is normally downloaded from duckdb.org on
    # first use; pre-install it at image build time if the cluster restricts
    # egress, or pub_tools.lake.duckdb_connection will fail with guidance.
    "duckdb>=1.1",
    # Staging streams zip members straight into object storage. s3fs also
    # arrives via dlt[s3], but this path no longer goes through dlt, so
    # declare it rather than depend on someone else's extra.
    "s3fs",
    # PUB LOG ingest no longer uses pandas directly (DuckDB does the CSV ->
    # Parquet conversion), but it stays declared explicitly: dlt and dagster
    # pull it transitively, and arm64 wheel resolution can miss it under uv on
    # aarch64 GitHub runners when it is only an indirect dependency.
    "pandas",
    # dagster-aws was pulled in when the mesh_demo component lived
    # here (it referenced dag_tools.io_managers.cortex_io_manager and
    # triggered __init__ side effects that imported dagster_aws).
    # mesh_demo has been relocated to dag-tools/user-deployment
    # (2026-06-26); pub-tools no longer needs dagster-aws directly,
    # but the dep is kept here for now because the broker pod
    # (running dag-tools.domain_broker against pub-tools' Definitions)
    # may rely on it transitively. Remove after a clean broker-pod
    # boot has been verified without it.
    "dagster-aws",
    # DataHub publishing — CortexPolarsIOManager.handle_output emits
    # the materialized URN directly via DataHubGraph (no sensor / no
    # version-skewed plugin). Only acryl-datahub itself is needed.
    "acryl-datahub",
    # Provides dag_tools.domain_broker (the FastAPI broker that the
    # iagent chart deploys as a second pod against this same image,
    # with a different startup command). The [broker] extras group
    # pulls in fastapi/hypercorn/httpx/pydantic/boto3 so the broker
    # pod can boot without a runtime pip install. Same pattern any
    # Dagster user-deployment uses to participate in an iagent mesh:
    # add edgy-dag-tools[broker] as a dep, run the broker module
    # against your own Definitions module.
    #
    # The distribution is `edgy-dag-tools`, not `dag-tools`: PyPI's
    # confusable-name check rejects dag-tools (it collapses to
    # "dagtools", which is taken). The requirement name must match the
    # package's own metadata or uv fails to build the git dependency.
    # The import name is unaffected and stays `dag_tools`.
    "edgy-dag-tools[broker] @ git+https://github.com/edgy-solutions/dag-tools.git@master",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
    "pytest",
]

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.dagster]
module_name = "pub_tools.definitions"
code_location_name = "pub_tools"

[tool.dagster.components]
register_components = ["pub_tools.components"]
