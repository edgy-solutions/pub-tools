[project]
name = "pub_tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster",
    "dagster-cloud",
    "dagster-postgres",
    "dlt[parquet,s3]>=1.22.2",
    "requests>=2.32.5",
    # publog_csv_resource uses pandas for CSV ingest. Declared explicitly
    # rather than relying on dlt's transitive deps because the arm64
    # wheel resolution can miss it under uv on aarch64 GitHub runners.
    "pandas",
    # dag_tools.io_managers.s3 imports dagster_aws.s3.io_manager — pulled
    # into our import chain via the mesh_demo component's reference to
    # dag_tools.io_managers.cortex_io_manager (which lives in the same
    # package and triggers __init__ side effects).
    "dagster-aws",
    # DataHub publishing — dag_tools.components.datahub_lineage builds a
    # make_datahub_sensor that emits asset materializations to DataHub.
    # acryl-datahub provides DataHubGraph; datahub-dagster-plugin
    # provides the sensor factory + DagsterGenerator.
    "acryl-datahub",
    "acryl-datahub-dagster-plugin",
    # Provides dag_tools.domain_broker (the FastAPI broker that the
    # iagent chart deploys as a second pod against this same image,
    # with a different startup command). The [broker] extras group
    # pulls in fastapi/hypercorn/httpx/pydantic/boto3 so the broker
    # pod can boot without a runtime pip install. Same pattern any
    # Dagster user-deployment uses to participate in an iagent mesh:
    # add dag-tools[broker] as a dep, run the broker module against
    # your own Definitions module.
    "dag-tools[broker] @ git+https://github.com/edgy-solutions/dag-tools.git@master",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
    "pytest",
]

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.dagster]
module_name = "pub_tools.definitions"
code_location_name = "pub_tools"

[tool.dagster.components]
register_components = ["pub_tools.components"]
