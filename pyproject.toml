[project]
name = "pub_tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster",
    "dagster-cloud",
    "dagster-postgres",
    "dlt[parquet,s3]>=1.22.2",
    "requests>=2.32.5",
    # Provides dag_tools.domain_broker (the broker FastAPI that
    # pub-tools' chart deploys as a second pod against this same
    # image, with a different startup command). Same pattern any
    # Dagster user-deployment uses to participate in an iagent mesh:
    # add dag-tools as a dep, run the broker module against your own
    # definitions module.
    "dag-tools @ git+https://github.com/edgy-solutions/dag-tools.git@master",
    # The broker is a FastAPI app served by hypercorn — the user-
    # deployment image needs these so the broker pod can boot without
    # an extra runtime pip install.
    "fastapi",
    "hypercorn",
    "httpx",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
    "pytest",
]

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.dagster]
module_name = "pub_tools.definitions"
code_location_name = "pub_tools"

[tool.dagster.components]
register_components = ["pub_tools.components"]
