name: Build Container Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate requirements.txt from pyproject.toml
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project > requirements.txt

      - name: Inject Golden Dockerfile
        run: |
          # 1. Create the Dockerignore (Keeps context small so build starts instantly)
          cat << 'EOF' > .dockerignore
          .git
          .github
          .venv
          venv
          __pycache__
          *.pyc
          data/
          tests/
          *.egg-info
          EOF
          
          # 2. Create the Single-Stage Dockerfile
          cat << 'EOF' > Dockerfile
          # syntax=docker/dockerfile:1
          FROM python:3.12-slim

          # Set environment variables so Python prints directly to logs
          ENV PYTHONUNBUFFERED=1
          ENV PYTHONDONTWRITEBYTECODE=1

          # Pull uv binary for blazing-fast dependency installation
          COPY --from=ghcr.io/astral-sh/uv:latest /uv /uvx /bin/

          WORKDIR /app

          # git is required for any `pip install git+https://...` dep
          # (e.g. dag-tools) that uv needs to clone before resolving.
          RUN apt-get update \
              && apt-get install -y --no-install-recommends git \
              && rm -rf /var/lib/apt/lists/*

          # Create a standard virtual environment and install dependencies
          RUN uv venv /app/venv
          COPY requirements.txt /app/

          RUN --mount=type=cache,target=/root/.cache/uv \
              uv pip install --python /app/venv -r /app/requirements.txt

          # PUB LOG ingest converts CSV -> Parquet with DuckDB reading and
          # writing s3:// directly, which needs DuckDB's httpfs extension.
          # DuckDB would fetch it from duckdb.org on first use -- at
          # materialization time, inside a cluster that restricts egress. Bake
          # it in instead, per architecture (this RUN executes under emulation
          # for each --platform), and into a fixed world-readable directory:
          # DuckDB's default is $HOME/.duckdb, and $HOME differs between the
          # build (root) and the runtime uid, so a home-relative install would
          # not be found again. The script verifies the extension loads with
          # auto-install disabled, so the build fails here rather than
          # producing an image that still needs the network.
          ENV DUCKDB_EXTENSION_DIRECTORY=/opt/duckdb/extensions
          COPY scripts/bake_duckdb_extensions.py /app/scripts/
          RUN /app/venv/bin/python /app/scripts/bake_duckdb_extensions.py \
              && chmod -R a+rX /opt/duckdb

          # Copy the application code
          COPY . /app

          # Put the virtual environment in the PATH so 'dagster' commands work natively
          ENV PATH="/app/venv/bin:$PATH"
          ENV PYTHONPATH="/app"

          # Standard Dagster Webserver command for User Deployment
          CMD ["dagster-webserver", "-h", "0.0.0.0", "-p", "8080", "-m", "pub_tools.definitions"]
          EOF

      - name: Set up QEMU
        # Required so the amd64 runner can build the arm64 layer under
        # emulation. The iagent k3s cluster runs on arm64 nodes; an
        # amd64-only image fails to schedule there with "no match for
        # platform in manifest."
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set repository name
        run: echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
