type: pub_tools.components.publog_pipeline.PublogPipelineComponent

attributes:
  # The lake path now comes from the asset key, which the DuckDB IO manager
  # owns, so `key_prefix` (default "publog") is what names the directory.
  # `dataset_name` is gone -- it used to build a date-versioned dataset
  # directory that nothing read.
  monthly_cron_schedule: "{{ env('PUBLOG_MONTHLY_CRON', '0 14 2 * *') }}"
  quarterly_cron_schedule: "{{ env('PUBLOG_QUARTERLY_CRON', '0 14 2 1,4,7,10 *') }}"
  schedule_timezone: "{{ env('PUBLOG_SCHEDULE_TZ', 'UTC') }}"

  # Concurrent steps per run. Each is a subprocess with its own DuckDB
  # budget, so this is bounded by the POD's memory limit — raising it
  # without raising that limit gets the pod OOMKilled mid-run, and the
  # run is then left STARTED forever because the run worker dies with it.
  # See the sizing note beside DUCKDB_MEMORY_LIMIT in the chart values.
  max_concurrent: "{{ env('PUBLOG_MAX_CONCURRENT', '4') }}"

  dest_config:
    drivername: filesystem
    destination:
      bucket_url: "{{ env('PUBLOG_S3_BUCKET_URL', 's3://publog-lake') }}"
    credentials:
      aws_access_key_id: "{{ env('AWS_ACCESS_KEY_ID', 'minioadmin') }}"
      aws_secret_access_key: "{{ env('AWS_SECRET_ACCESS_KEY', 'minioadmin') }}"
      endpoint_url: "{{ env('AWS_ENDPOINT_URL', 'http://minio:9000') }}"
