type: dag_tools.components.datahub_lineage.DatahubLineageComponent

attributes:
  # DataHub GMS base URL. The dagster plugin's DataHubGraph client
  # constructs its own /api/graphql / /openapi endpoints from this
  # base — pass the bare GMS root here, not the GraphQL endpoint.
  # Other env vars (e.g. DATAHUB_GMS_URL) point at the GraphQL leaf
  # for GraphQL clients; keep DATAHUB_SERVER distinct for clarity.
  datahub_config:
    server: "{{ env('DATAHUB_SERVER', 'http://datahub-gms:8080') }}"

  # The defaults below match the dag-tools component's defaults
  # but pin them in config so per-deployment overrides are obvious.
  environments: ["prod", "uat", "sandbox", "dev", "test"]
  platforms: ["clickhouse", "snowflake", "postgres", "dagster"]
  filesystem_platforms: ["s3", "abs", "filesystem"]
